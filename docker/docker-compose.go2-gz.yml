# Unitree GO2 Gazebo Simulation Docker Compose configuration
# Usage: docker compose -f docker-compose.go2-gz.yml --profile go2-gz up -d
#
# 前置条件：本地构建 go2_gz_sim 源码
#   使用脚本：./docker/build-go2-gz-sim-source.sh
#
# 注意：此配置包含 rosbridge_server 服务，OpenClaw 通过 ws://agiros:9090 连接

services:
  # GO2 Gazebo Simulation
  go2-gz-sim:
    image: rosclaw/go2-gz-sim:latest
    build:
      context: ..
      dockerfile: docker/Dockerfile.go2-gz-sim
    container_name: rosclaw-go2-gz-sim
    environment:
      - ROS_DOMAIN_ID=${ROS_DOMAIN_ID:-0}
      # GZ_SIM_RESOURCE_PATH 包含模型和世界文件路径
      # 注意：必须包含 src/gazebo_sim/models 才能找到 rmuc_2025 等源码模型
      - GZ_SIM_RESOURCE_PATH=/opt/go2_gz_sim/models:/opt/go2_gz_sim/src/gazebo_sim/models:/opt/go2_gz_sim/src/gazebo_sim/world
      - GZ_SIM_PLUGIN_PATH=/opt/go2_gz_sim/install
      - COLCON_CURRENT_PREFIX=/opt/go2_gz_sim/install
      # GUI 模式配置：true 启用 GUI（需要 X11），false 无头模式（默认）
      - GO2_GUI=${GO2_GUI:-false}
      # 世界文件配置：从 .env 读取
      - GO2_WORLD=${GO2_WORLD:-empty.world}
      - DISPLAY=${DISPLAY:-:0}
      - QT_X11_NO_MITSHM=1
    ports:
      - "8080:8080"
    volumes:
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
      # 挂载 go2_gz_sim 源码和构建产物（默认路径）
      - ${GO2_GZ_SIM_PATH:-/home/jhq/work/code/go2_ws/go2_sim_ws/ROS2-Gazebo-GO2}:/opt/go2_gz_sim:ro
    networks:
      - rosclaw-network
    profiles:
      - go2-gz
    # GPU 支持（可选）
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    # 使用入口点脚本，支持 GUI/无头模式切换
    # entrypoint 脚本会设置环境变量，然后执行 bash -c 传递的 command
    entrypoint: ["/entrypoint.sh"]
    command:
      - bash
      - -c
      - |
        export GO2_WORLD=${GO2_WORLD:-empty.world}
        export GO2_SENSORS=${GO2_SENSORS:-false}
        echo "Starting GO2 Gazebo simulation with world: $$GO2_WORLD"
        echo "GUI mode: $$GO2_GUI"
        echo "Sensors: $$GO2_SENSORS"

        # 使用 ROS2-Gazebo-GO2 提供的 launch.py 文件
        # 此 launch 文件支持 world 和 sensors 参数
        agiros launch gazebo_sim launch.py world:=$$GO2_WORLD sensors:=$$GO2_SENSORS

  # GO2 Bridge Node - 运行 RosClaw bridge
  go2-bridge-node:
    image: rosclaw/go2-gz-sim:latest
    container_name: rosclaw-go2-bridge
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        export COLCON_CURRENT_PREFIX=/opt/go2_gz_sim/install
        source /opt/agiros/loong/setup.sh
        source /opt/go2_gz_sim/install/local_setup.sh
        export COLCON_CURRENT_PREFIX=/opt/rosclaw/install
        source /opt/rosclaw/install/local_setup.sh
        agiros launch unitree_go2 go2_gz_bridge_launch.py
    environment:
      - ROS_DOMAIN_ID=${ROS_DOMAIN_ID:-0}
    volumes:
      - ${GO2_GZ_SIM_PATH:-/home/jhq/work/code/go2_ws/go2_sim_ws/ROS2-Gazebo-GO2}:/opt/go2_gz_sim:ro
      - /home/jhq/work/code/claw_ws/rosclaw/agiros_ws/install:/opt/rosclaw/install:ro
    networks:
      - rosclaw-network
    profiles:
      - go2-gz
    depends_on:
      - go2-gz-sim

  # GO2 Scene Node - 启动场景相关的 launch 文件（建图、导航等）
  go2-scene-node:
    image: rosclaw/go2-gz-sim:latest
    container_name: rosclaw-go2-scene
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        export COLCON_CURRENT_PREFIX=/opt/go2_gz_sim/install
        source /opt/agiros/loong/setup.sh
        source /opt/go2_gz_sim/install/local_setup.sh

        export GO2_SCENE=${GO2_SCENE:-none}
        echo "Starting GO2 scene node with scene: $$GO2_SCENE"

        case "$$GO2_SCENE" in
          cartographer)
            echo "Starting Cartographer SLAM..."
            agiros launch cartographer go2_cartographer.launch.py
            ;;
          navigation2)
            echo "Starting Nav2 Navigation..."
            agiros launch navigation2 go2_navigation2.launch.py
            ;;
          none|*)
            echo "No scene node selected (GO2_SCENE=none), skipping..."
            sleep infinity
            ;;
        esac
    environment:
      - ROS_DOMAIN_ID=${ROS_DOMAIN_ID:-0}
      - GO2_SCENE=${GO2_SCENE:-none}
    volumes:
      - ${GO2_GZ_SIM_PATH:-/home/jhq/work/code/go2_ws/go2_sim_ws/ROS2-Gazebo-GO2}:/opt/go2_gz_sim:ro
    networks:
      - rosclaw-network
    profiles:
      - go2-gz
    depends_on:
      - go2-gz-sim

  # ROSBridge Server - OpenClaw 连接到此服务
  agiros:
    image: rosclaw/go2-gz-sim:latest
    container_name: rosclaw-rosbridge
    ports:
      - "${ROSBRIDGE_PORT:-9090}:${ROSBRIDGE_PORT:-9090}"
    entrypoint: ["/bin/bash", "-c"]
    command: ["source /opt/agiros/loong/setup.sh && source /opt/rosclaw/install/setup.sh && agiros launch rosbridge_server rosbridge_websocket_launch.xml"]
    environment:
      - ROS_DOMAIN_ID=${ROS_DOMAIN_ID:-0}
      - COLCON_CURRENT_PREFIX=/opt/rosclaw/install
    volumes:
      - /home/jhq/work/code/claw_ws/rosclaw/agiros_ws/install:/opt/rosclaw/install:ro
    networks:
      - rosclaw-network
    profiles:
      - go2-gz

networks:
  rosclaw-network:
    external: true
    name: ${DOCKER_NETWORK_NAME:-1panel-network}
