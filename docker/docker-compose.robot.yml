version: "3.8"

# Mode C: Robot-side — AGIROS + agirosclaw_agent on the robot.
# The agent connects outbound to the signaling server and bridges
# WebRTC data channel messages to local AGIROS DDS.

services:
  # AGIROS stack (no rosbridge needed — agent talks directly to DDS)
  agiros:
    build:
      context: .
      dockerfile: Dockerfile.agiros
    image: agirosclaw/agiros:latest
    environment:
      - ROS_DOMAIN_ID=0
      - GAZEBO_MODEL_PATH=/opt/agiros/pixiu/share/turtlebot3_gazebo/models
      - TURTLEBOT3_MODEL=burger
    network_mode: host

  # RosClaw agent node (connects to signaling server, bridges to DDS)
  agirosclaw-agent:
    build:
      context: .
      dockerfile: Dockerfile.agiros
    image: agirosclaw/agiros:latest
    command: ["agiros", "run", "agirosclaw_agent", "agent_node"]
    environment:
      - ROS_DOMAIN_ID=0
      - ROSCLAW_SIGNALING_URL=${SIGNALING_URL}
      - ROSCLAW_ROBOT_TOKEN=${ROBOT_TOKEN}
      - ROSCLAW_ROBOT_KEY=${ROBOT_KEY}
      - ROSCLAW_ROBOT_ID=${ROBOT_ID}
    depends_on:
      - agiros
    network_mode: host
