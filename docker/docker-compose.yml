# RosClaw AGIROS + rosbridge_server + Gazebo simulation
# Configuration is loaded from .env file

services:
  # AGIROS + rosbridge_server + Gazebo simulation (default CPU-only)
  agiros:
    build:
      context: ..
      dockerfile: docker/Dockerfile.agiros
    image: agirosclaw/agiros:latest
    ports:
      - "${ROSBRIDGE_PORT:-9090}:${ROSBRIDGE_PORT:-9090}"   # rosbridge WebSocket
      - "${ROS_MASTER_PORT:-11311}:${ROS_MASTER_PORT:-11311}" # ROS master (if needed)
    environment:
      - ROS_DOMAIN_ID=${ROS_DOMAIN_ID:-0}
      - GAZEBO_MODEL_PATH=/opt/agiros/pixiu/share/turtlebot3_gazebo/models
      - TURTLEBOT3_MODEL=${TURTLEBOT3_MODEL:-burger}
      - DISPLAY=${DISPLAY:-:0}
      - QT_X11_NO_MITSHM=1
    volumes:
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
    networks:
      - agirosclaw-network

  # GPU-enabled variant - use with: docker compose --profile gpu up -d
  agiros-gpu:
    build:
      context: ..
      dockerfile: docker/Dockerfile.agiros
    image: agirosclaw/agiros:latest
    container_name: agirosclaw-agiros-gpu
    ports:
      - "${ROSBRIDGE_PORT:-9090}:${ROSBRIDGE_PORT:-9090}"   # rosbridge WebSocket
      - "${ROS_MASTER_PORT:-11311}:${ROS_MASTER_PORT:-11311}" # ROS master (if needed)
    environment:
      - ROS_DOMAIN_ID=${ROS_DOMAIN_ID:-0}
      - GAZEBO_MODEL_PATH=/opt/agiros/pixiu/share/turtlebot3_gazebo/models
      - TURTLEBOT3_MODEL=${TURTLEBOT3_MODEL:-burger}
      - DISPLAY=${DISPLAY:-:0}
      - QT_X11_NO_MITSHM=1
      - NVIDIA_VISIBLE_DEVICES=${NVIDIA_VISIBLE_DEVICES:-all}
      - NVIDIA_DRIVER_CAPABILITIES=${NVIDIA_DRIVER_CAPABILITIES:-graphics,utility,compute}
    volumes:
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
    networks:
      agirosclaw-network:
        aliases:
          - agiros
    profiles:
      - gpu
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu, graphics, compute, utility]

networks:
  agirosclaw-network:
    external: true
    name: ${DOCKER_NETWORK_NAME:-1panel-network}
